[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gic-volqrc"
version = "0.3.0"
description = "VolQRC: Volatility Quantum Reservoir Computing for GIC 2026"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.2,<3",
    "qiskit-aer>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "arch>=6.1",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
qbraid = ["qbraid>=0.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gic*", "src*", "prototype*"]

[tool.pytest.ini_options]
testpaths = ["tests", "prototype/tests"]
addopts = "-q --tb=short"
